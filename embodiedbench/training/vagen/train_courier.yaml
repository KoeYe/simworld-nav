# Training episodes for the courier benchmark under VAGEN/verl.
#
# The env name must match the key added to the registry on the launch command
# line (see train_grpo_courier.sh), which is how this plugs in without editing
# anything inside the gitignored vendor/ checkout.
#
# Seeds: [first, last, repeats]. The training range stops at 800 and validation
# starts at 1000, so the two never overlap. That gap is not cosmetic -- the
# first hand-rolled run in this repo reported the training batch's own score
# and produced a curve that --learning-rate 0 reproduced exactly.
envs:
  - name: Courier
    n_envs: 800
    data_source: courier_paris
    seed: [0, 800, 1]
    max_turns: 40
    response_length_per_turn: 1024   # a cap, not a target: 48 truncated a 4B's
                                     # reasoning before its fenced call
    config:
      difficulty: solo
      stride: block
      embodiment: human_on_foot
      hazards: true
      # What this project is for: the fee the job pays, not four constants
      # chosen in this repository. Punctuality and job size are inside the
      # number already -- full fee on time, a fraction late, 3.00 plus a cent
      # a metre -- so a policy that maximises it is a courier that earns.
      reward_basis: earnings
      # Dense term: metres closed on the target, potential-based, never in
      # env_return. Without it GRPO's first step logged reward_variance 0.0
      # and grad_norm 0.0 -- a 3B never delivers, so every sample in the
      # group scores the same and there is no advantage to push on.
      progress_weight: 0.2
      max_images: 1
      # 320px long side is ~1/4 the tokens of the 640x480 frame,
      # which is what pays for 12 turns instead of 4. Successful
      # collections were measured on turns 2,3,5,5,8,14,14,17,26,36:
      # a four-turn window saw two of them.
      image_max_side: 320
      # One picture per turn, and 8 turns, because the whole trajectory is
      # concatenated into a single prompt. A 640x480 frame costs ~380 tokens
      # after the vision merge, so the harness's usual five-per-turn over 20
      # turns is ~38k image tokens against an 8k budget. When the prompt is
      # truncated the image tokens go with it, but multi_modal_data still
      # lists every image, and get_rope_index then walks one grid too many:
      #   RuntimeError: shape mismatch: value tensor of shape [3, 8145]
      #   cannot be broadcast to indexing result of shape [3, 7765]
      # -- a difference of exactly one image. This is an image budget, not a
      # cosmetic default.
      album_root: /data/murray/paris_streets_v2/citycore-paris
      # ^ uncomment for the sighted task. Without it the episode is text-only,
      #   which is the blind control, not the benchmark.
