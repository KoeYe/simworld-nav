# Training episodes for the courier benchmark under VAGEN/verl.
#
# The env name must match the key added to the registry on the launch command
# line (see train_grpo_courier.sh), which is how this plugs in without editing
# anything inside the gitignored vendor/ checkout.
#
# Seeds: [first, last, repeats]. The training range stops at 800 and validation
# starts at 1000, so the two never overlap. That gap is not cosmetic -- the
# first hand-rolled run in this repo reported the training batch's own score
# and produced a curve that --learning-rate 0 reproduced exactly.
envs:
  - name: Courier
    n_envs: 800
    data_source: courier_paris
    seed: [0, 800, 1]
    max_turns: 40
    response_length_per_turn: 1024   # a cap, not a target: 48 truncated a 4B's
                                     # reasoning before its fenced call
    config:
      difficulty: solo
      stride: block
      embodiment: human_on_foot
      hazards: true
      # What this project is for: the fee the job pays, not four constants
      # chosen in this repository. Punctuality and job size are inside the
      # number already -- full fee on time, a fraction late, 3.00 plus a cent
      # a metre -- so a policy that maximises it is a courier that earns.
      # Per hour, not per job. The fee is 3.00 plus a cent a metre of the
      # ORDER, so it pays the same however the shift went: the first real
      # training step scored 4.075 with within-group variance of exactly 0.0
      # and so pg_loss 0.0 and grad_norm 0.0, while scores across the batch
      # ranged 0.0 to 5.43. Four samples of one order either all delivered,
      # for the identical fee, or none did, for 0.0. All the variance was
      # between orders, which is where GRPO cannot use it.
      #
      # A rate separates a ten-turn delivery from a twenty-one-turn one, and
      # walking time is what a route choice costs -- sim_seconds accrues per
      # street walked, per wait at a red and per red crossed. It stays 0.0 for
      # a shift that delivered nothing, so unlike a straight charge for time
      # it never pays to give up early. Validation stays on `earnings` so the
      # held-out number remains money and stays comparable with every run
      # measured so far.
      reward_basis: earnings_per_hour
      # Dense term: metres closed on the target, potential-based, never in
      # env_return. Without it GRPO's first step logged reward_variance 0.0
      # and grad_norm 0.0 -- a 3B never delivers, so every sample in the
      # group scores the same and there is no advantage to push on.
      # Off. The ladder was for a policy that never delivered: a group of
      # four all scoring zero has no advantage to push on. Success is now
      # 17.2% held-out, so 53% of groups contain at least one paying episode
      # and the money has variance of its own.
      #
      # Left on, it drowns the objective. Distance accumulates over forty
      # turns while a fee is one payment that rarely lands, so even at 0.2 the
      # split at step 20 was 2.22 shaping against 0.077 earnings -- 96.7% of
      # the gradient was "walk closer". Training score rose to its maximum
      # while held-out earnings fell 90% and deliveries went 17.2% -> 1.6%.
      # The policy learned exactly what it was paid to learn.
      progress_weight: 0.0
      max_images: 3
      # Street views per turn; a pedestrian lamp rides along with its street.
      #
      # Was 1, which completely covered 4% of this map's junctions -- almost
      # every choice was made without seeing most of the candidates. 3 covers
      # 93% (the junctions have 1-6 streets, median 2). Measured cost: 1.05
      # images a turn becomes 2.65, so about 3.4k image tokens over a 40-turn
      # episode becomes 8.5k, against a 36.8k response budget and a measured
      # 14.6k in use. It fits.
      #
      # This also closes a gap between training and evaluation, which sends
      # every frame: the two were choosing streets from different amounts of
      # evidence and their numbers were being compared anyway.
      #
      # The original reason for 1 was a 640x480 frame at ~380 tokens and an
      # mrope crash when a truncated prompt left multi_modal_data listing
      # images the tokens no longer covered. The frames are 320px now, at
      # roughly 80 tokens, and clip_ratio has been 0.0 throughout.
      # "320px now" is this key; it must match val_courier.yaml.
      image_max_side: 320
      album_root: /data/murray/paris_streets_v2/citycore-paris
      # ^ uncomment for the sighted task. Without it the episode is text-only,
      #   which is the blind control, not the benchmark.
