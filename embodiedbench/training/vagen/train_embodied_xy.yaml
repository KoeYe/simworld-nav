# Training episodes for the COORDINATE action space: the courier names a
# point and the pawn walks toward it, instead of naming one of the streets
# leaving this junction.
#
# This file is train_embodied.yaml with two keys added and nothing else
# changed, and it is meant to be diffed against it. The comparison the
# coordinate arm exists for -- does naming a point succeed more or less often
# than naming a street -- is only readable if the two arms differ in the
# action space and in nothing else. Every other axis here (narration, stride,
# the fleet, the image budget, the chunk, the dt-matched arrival geometry) is
# its sibling's, verbatim.
#
# Why the arm exists: the base model already completes deliveries zero-shot in
# the street space -- 18 of 18 hops, parcel collected and delivered, no
# training step taken -- so nearly every rollout in a GRPO group succeeds, the
# group-normalised advantage is ~0 and so is the gradient. The reward is not
# obviously broken; the task is close to solved. This is a harder question
# asked of the same world, and the number to read off it is the SUCCESS RATE
# against the street arm, not the throughput -- throughput was never what
# stopped learning.

envs:
  - name: Embodied
    n_envs: 800
    data_source: courier_paris_embodied_xy
    seed: [0, 800, 1]
    max_turns: 4
    response_length_per_turn: 512
    config:
      backend: embodied
      difficulty: solo
      stride: block
      embodiment: human_on_foot
      hazards: false
      # Which facts the WORDS may state, from courier-environment@a3d8ae8.
      # "route" marks the route street in the list of streets; red lights and
      # barriers stay in the photographs. Set on BOTH train and val on
      # purpose: this is a definition of the task, not a training aid, and a
      # run that trains on one setting and scores on another is measuring
      # neither. Untrained, the courier's failure was that it could not tell
      # which way to go -- it re-walked one street for the whole shift -- so
      # this is the axis that decides whether the reward can ever be non-zero,
      # and it is theirs to choose; "route" is the middle of three.
      narration: route
      reward_basis: earnings
      # The courier lesson transfers unchanged: shaping drowned the objective
      # at 0.2 on the offline env (96.7% of the gradient was "walk closer").
      progress_weight: 0.0
      max_images: 2
      image_max_side: 256
      # Fleet + cache locations are host facts, rewired per machine the same
      # way point_at_albums.py rewires album paths for the offline yamls.
      ue_endpoints: /data/koe/nav_fleet_game/endpoints.json
      live_cache_root: /data/koe/nav_live_cache
      spawn_z_cm: 100.0
      # Sim clock at 16x realtime. Measured on ds-serv6: displacement stays
      # within 1.0% of speed x dt, 36 hard impacts across three speeds all
      # stopped at the same wall (swept collision, no tunnelling), and a
      # capture after a 84 m walk converges FASTER than at 0.0333 (8 settle
      # frames buy 1.6 sim-seconds of adaptation instead of 0.27).
      # tick_chunk and arrive_cm must move with it: a tick is 28 cm here, so
      # checking arrival every 10 ticks would look 280 cm apart and the
      # courier would sail past a 50 cm radius and report stuck.
      tick_chunk: 2
      arrive_cm: 120.0
      # Three tool calls per turn. A solo delivery needs collect, several
      # walks and hand_over -- more than the four turns the KV budget pays
      # for at one call each, and raising max_turns does not fit: each turn
      # injects ~420 tokens of observation, so twelve of them want an 11k
      # response region against a ~10k total budget. Chunking buys the
      # twelve actions inside the four turns instead, which is the whole
      # point of it: fewer prefills, same physics.
      action_chunk: 3
      # The action space, and the only thing that differs from the street
      # arm. See runtime/live/embodied_env.py.
      action_space: coordinate
      # How far one call may carry, in metres. Measured, not chosen: over 300
      # block-stride legs on this map one walk_to covers a median 38.8 m and a
      # p75 of 59.5 m. At the street arm's own p75 a coordinate call is never
      # the cheaper action, so a difference in success rate cannot be bought
      # with a more generous step cap.
      max_step_m: 60.0
