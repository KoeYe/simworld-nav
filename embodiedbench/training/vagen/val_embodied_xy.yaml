# Held-out episodes for the COORDINATE action space: the courier names a
# point and the pawn walks toward it, instead of naming one of the streets
# leaving this junction.
#
# This file is val_embodied.yaml with two keys added and nothing else
# changed, and it is meant to be diffed against it. The comparison the
# coordinate arm exists for -- does naming a point succeed more or less often
# than naming a street -- is only readable if the two arms differ in the
# action space and in nothing else. Every other axis here (narration, stride,
# the fleet, the image budget, the chunk, the dt-matched arrival geometry) is
# its sibling's, verbatim.
#
# Why the arm exists: the base model already completes deliveries zero-shot in
# the street space -- 18 of 18 hops, parcel collected and delivered, no
# training step taken -- so nearly every rollout in a GRPO group succeeds, the
# group-normalised advantage is ~0 and so is the gradient. The reward is not
# obviously broken; the task is close to solved. This is a harder question
# asked of the same world, and the number to read off it is the SUCCESS RATE
# against the street arm, not the throughput -- throughput was never what
# stopped learning.

envs:
  - name: Embodied
    n_envs: 32
    data_source: courier_paris_embodied_xy_val
    seed: [1000, 1032, 1]
    # 40, the same as the offline task in val_courier.yaml.
    #
    # The live configs were cut to 4 and 16 against a KV budget, and the cut
    # was paid for by `action_chunk: 3` -- one prompt buying three actions, so
    # four turns was twelve steps. A chunk is a PLAN now: three waypoints are
    # estimated and one is walked, because waypoints two and three are named
    # relative to a position the first walk has already had a chance to
    # falsify. So a turn buys one action, and the turn count has to be the
    # offline one or the task is a different, shorter task.
    #
    # A median job is 247 m and one call carries 9 m of ground: 27 calls. 40
    # turns finishes it with room for the mistakes.
    max_turns: 40
    response_length_per_turn: 1024
    config:
      backend: embodied
      difficulty: solo
      stride: block
      embodiment: human_on_foot
      hazards: false
      # Three keys this file was missing while its own smoke sibling carried
      # them, and each one silently made the reportable number measure
      # something other than the run that produced it.
      #
      # ``narration`` is a definition of the task, and train_embodied.yaml
      # says so in as many words: a run that trains at "route" and scores at
      # the "none" default is measuring neither.
      narration: route
      reward_basis: earnings
      progress_weight: 0.0
      max_images: 3
      image_max_side: 320
      ue_endpoints: /data/koe/nav_fleet_game/endpoints.json
      live_cache_root: /data/koe/nav_live_cache
      spawn_z_cm: 100.0
      # And these two are properties of the FLEET, not of the split: the
      # engine's dt is set when the fleet launches, and both splits walk the
      # same fleet. At 16x a tick is 28 cm, so the defaults (chunk 10, radius
      # 50 cm) look 280 cm apart -- the courier sails past its node and the
      # walk reports stuck. Validation would have counted the arithmetic of
      # its own arrival check as a navigation failure.
      action_chunk: 3
      # The action space, and the only thing that differs from the street
      # arm. See runtime/live/embodied_env.py.
      action_space: coordinate
      # One photograph, of what is in front. The per-street frames are the
      # STREET space's design -- a picture beside each candidate, captioned in
      # the words walk_to takes. This courier does not take streets by name,
      # so at a four-way junction it was being handed four pictures, three of
      # them down streets it cannot name and one of them the way it came, and
      # they filled the image budget. A person walking does not get a
      # photograph of behind them each time they take a step.
      #
      # The list of streets is untouched: their names, bearings and distances
      # still print, and the route marker still says which way. What changes
      # is only what the CAMERA is pointed at.
      camera_view: forward
      # How far one call may carry, in metres. A request past it is REFUSED,
      # not clamped, and refused when the call RUNS -- so the second and third
      # waypoints of a chunk are judged from where the earlier walks left the
      # courier, which is what they were named relative to.
      #
      # 10 m clears four constraints at once: a median 247 m job is 27 calls
      # (nine turns at chunk 3) against a budget of sixteen, so a delivery is
      # reachable; it sits on the scale the policy actually reaches for
      # (2.6 m min, 4.8 m median, 16.2 m max when it named a point that was
      # not under its feet); it stays well under the street arm's own 38.8 m
      # median leg, so a coordinate call is never the cheaper action; and the
      # arrival geometry below closes against it.
      max_step_m: 10.0
      # These two move WITH the step and are checked against it at
      # construction. One tick carries 28 cm at this dt, arrival is only
      # tested at chunk boundaries, and the radius has to sit inside the cap
      # or every request is either "already there" or "too far".
      arrive_cm: 100.0
      tick_chunk: 2
