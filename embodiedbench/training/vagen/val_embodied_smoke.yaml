# Smoke-sized held-out set: 8 seeds, same contract as val_embodied.yaml.
# Exists so a short curve-producing run does not spend half its wall clock
# validating; the full 32-seed set is the reportable one.
envs:
  - name: Embodied
    n_envs: 8
    data_source: courier_paris_embodied_val
    seed: [1000, 1008, 1]
    max_turns: 16
    response_length_per_turn: 1024
    config:
      backend: embodied
      difficulty: solo
      stride: block
      embodiment: human_on_foot
      hazards: false
      reward_basis: earnings
      progress_weight: 0.0
      max_images: 3
      image_max_side: 320
      ue_endpoints: /data/koe/nav_fleet_game/endpoints.json
      live_cache_root: /data/koe/nav_live_cache
      spawn_z_cm: 100.0
